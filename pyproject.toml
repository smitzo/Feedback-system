[project]
name = "feedback-system"
version = "1.0.0"
description = "Permission-aware employee feedback and development"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn[standard]>=0.38,<1",
  "sqlalchemy>=2.0.44,<2.1",
  "alembic>=1.17,<2",
  "pydantic-settings>=2.11,<3",
  "email-validator>=2.3,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "httpx>=0.28,<1", "ruff>=0.14,<1", "pytest-cov>=7,<8"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/cli.py"]

[tool.coverage.report]
show_missing = true
